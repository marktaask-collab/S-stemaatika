<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Süstemaatika mäng</title>
<style>
:root{--bg:#f4f7f2;--card:#fff;--tx:#1d2b1f;--mut:#5d6f60;--ac:#2f7d4f;--ok:#2f7d4f;--bad:#b3392f;--bd:#cfdccf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b16;--card:#1d2820;--tx:#e8f0e9;--mut:#9db0a0;--ac:#5fc18a;--ok:#5fc18a;--bad:#ef7d72;--bd:#33463a}}
:root[data-theme="dark"]{--bg:#141b16;--card:#1d2820;--tx:#e8f0e9;--mut:#9db0a0;--ac:#5fc18a;--ok:#5fc18a;--bad:#ef7d72;--bd:#33463a}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px}
.box{width:100%;max-width:560px}
h1{font-size:1.4rem;margin:.2em 0}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.q{font-size:1.25rem;font-weight:600;margin:6px 0 4px}
.hint{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:11px 8px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.main{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;margin-top:10px;font-weight:600}
.fb{margin-top:12px;font-size:.95rem;min-height:2.4em}
.score{font-size:2.4rem;font-weight:700;color:var(--ac)}
.ladder{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.ladder div{padding:5px 10px;border-radius:6px;background:color-mix(in srgb,var(--ac) 14%,var(--card));font-size:.9rem}
</style>
</head>
<body>
<div class="box">
<h1>🧬 Süstemaatika mäng</h1>
<p class="sub">Määra, millise süstemaatilise taksoni kohta näide käib, ja millisesse riiki organism kuulub.</p>
<div id="app"></div>
</div>
<script>
var LV=["liik","perekond","sugukond","selts","klass","hõimkond","riik"];
var KG=["bakterid","arhed","protistid","seened","taimed","loomad"];
var Q=[
{t:"Homo sapiens",o:LV,a:"liik",h:"Kahenimeline nimetus: perekonna + liigi nimi.",why:"Kahenimeline (binaarne) nimetus tähistab alati liiki."},
{t:"Homo",o:LV,a:"perekond",h:"Üks sõna, algab suure tähega.",why:"Perekonda Homo kuuluvad näiteks H. erectus, H. neanderthalensis ja H. sapiens."},
{t:"Inimlased (Hominidae)",o:LV,a:"sugukond",h:"Hõlmab mitut perekonda.",why:"Sugukonda kuuluvad mitu perekonda (inimene, šimpans, gorilla, orangutan)."},
{t:"Primaadid",o:LV,a:"selts",h:"Hõlmab mitut sugukonda.",why:"Seltsi kuuluvad mitu sugukonda: inimahvid, ahvid, poolahvid jt."},
{t:"Imetajad",o:LV,a:"klass",h:"Hõlmab palju seltse.",why:"Klass Imetajad: primaadid, kiskjad, näriliste selts jne."},
{t:"Keelikloomad",o:LV,a:"hõimkond",h:"Hõlmab klasse: kalad, kahepaiksed, linnud, imetajad.",why:"Hõimkond on riigi järel suuruselt teine takson."},
{t:"Loomad",o:LV,a:"riik",h:"Kõige suurem takson.",why:"Riik on kõige kõrgem süstemaatiline üksus."},
{t:"Harilik hunt (Canis lupus)",o:LV,a:"liik",h:"Kahenimeline nimetus.",why:"Canis lupus on liigi nimi, Canis on perekond."},
{t:"Kiskjad (Carnivora)",o:LV,a:"selts",h:"Siia kuuluvad koerlased, kasselased, karulased.",why:"Kiskjad on selts, mis koosneb mitmest sugukonnast."},
{t:"Koerlased (Canidae)",o:LV,a:"sugukond",h:"Hunt, rebane, šaakal…",why:"Sugukond koondab mitu perekonda (Canis, Vulpes jt)."},
{t:"Canis (hundid ja šaakalid)",o:LV,a:"perekond",h:"Üks ladinakeelne sõna.",why:"Canis on perekond: hunt, koer, kojott, šaakal."},
{t:"Escherichia coli (soolekepike)",o:KG,a:"bakterid",h:"Päristuumata, rakuseinas mureiin.",why:"Päristuumne puudub, seega bakter (eubakter)."},
{t:"Halobacterium (elab väga soolases vees)",o:KG,a:"arhed",h:"Päristuumata, ekstreemsed elupaigad.",why:"Arhed on päristuumata ja elavad sageli ekstreemsetes tingimustes."},
{t:"Amööb",o:KG,a:"protistid",h:"Päristuumne, üherakuline.",why:"Üherakulised päristuumsed organismid kuuluvad protistide hulka."},
{t:"Kukeseen",o:KG,a:"seened",h:"Rakuseinas kitiin, heterotroof.",why:"Seened on heterotroofid, rakuseinas on kitiin."},
{t:"Harilik kuusk",o:KG,a:"taimed",h:"Fotosünteesib, rakuseinas tselluloos.",why:"Fotosünteesivad hulkraksed autotroofid on taimed."},
{t:"Pärm",o:KG,a:"seened",h:"Üherakuline, aga mitte protist!",why:"Pärm on üherakuline seen (kitiin rakuseinas), kuigi on üherakuline."},
{t:"Lõvi",o:KG,a:"loomad",h:"Hulkrakne heterotroof, rakuseinata.",why:"Rakuseinata hulkrakne heterotroof on loom."}
];
var app=document.getElementById("app"),i=0,sc=0,order=[];
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function start(){order=shuffle(Q).slice(0,12);i=0;sc=0;show()}
function show(){
 if(i>=order.length){return end()}
 var q=order[i],kind=q.o===LV?"Mis tasemega on tegemist?":"Millisesse riiki see kuulub?";
 app.innerHTML='<div class="bar"><i style="width:'+(i/order.length*100)+'%"></i></div><div class="card"><div class="hint">Küsimus '+(i+1)+' / '+order.length+' · Punkte: '+sc+'</div><div class="q">'+q.t+'</div><div class="hint">'+kind+'</div><div class="opts" id="o"></div><div class="fb" id="fb"></div></div>';
 var o=document.getElementById("o");
 q.o.forEach(function(x){var b=document.createElement("button");b.textContent=x;b.onclick=function(){pick(b,x)};o.appendChild(b)});
}
function pick(b,x){
 var q=order[i],ok=x===q.a,fb=document.getElementById("fb");
 Array.prototype.forEach.call(document.querySelectorAll("#o button"),function(e){e.disabled=true;if(e.textContent===q.a)e.className="ok"});
 if(ok){sc++;fb.textContent="✅ Õige! "+q.why}else{b.className="bad";fb.textContent="❌ Õige vastus: "+q.a+". "+q.why}
 var n=document.createElement("button");n.className="main";n.textContent=i+1<order.length?"Edasi →":"Tulemus";n.onclick=function(){i++;show()};
 fb.parentNode.appendChild(n);
}
function end(){
 var p=Math.round(sc/order.length*100),m=p>=85?"Suurepärane, oled süstemaatika meister! 🏆":p>=60?"Hea tulemus, kordame veel veidi.":"Vaata materjal üle ja proovi uuesti.";
 app.innerHTML='<div class="card"><div class="score">'+sc+' / '+order.length+'</div><p>'+m+'</p><b>Süstemaatika tasemed (väiksemast suuremani):</b><div class="ladder"><div>1. liik</div><div>2. perekond</div><div>3. sugukond</div><div>4. selts</div><div>5. klass</div><div>6. hõimkond</div><div>7. riik</div></div><p class="hint">Kuus riiki: bakterid, arhed, protistid, seened, taimed, loomad.</p><button class="main" id="r">Mängi uuesti</button></div>';
 document.getElementById("r").onclick=start;
}
start();
</script>
</body>
</html>
